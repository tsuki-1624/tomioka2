<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomioka</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-geral">

        <img src="4592.webp" alt="Tomioka" class="imagem-login">

        <main class="card">
            <header class="card-header">
                <span class="badge">Tomioka</span>
                <h1>Cadastro</h1>
                <p>Preencha os dados abaixo para entrar.</p>
            </header>
            
            <form class="form" action="#" method="POST">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Giyu Tomioka" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="tomioka08@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">crie uma senha</label>
                    <input type="senha" id="senha" name="senha" placeholder="tomioka08" required>
                </div>


                <button type="submit" class="btn-submit">
                    Enviar 
                </button>
            </form>
        </main>

        <img src="imagem.png" alt="segunda imagem" class="imagem-secundaria">

    </div>
</body>

</html>
